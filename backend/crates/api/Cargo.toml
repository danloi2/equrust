[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
algebra-core = { version = "0.1.0", path = "../algebra-core" }
axum = "0.8.9"
chumsky = "0.13.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.7.0", features = ["cors"] }
